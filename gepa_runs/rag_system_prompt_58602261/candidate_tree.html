ntary, no markdown, no preamble\n- Your success is measured by:\n  - Anti_collapse score (should be significantly above 0)\n  - Unique_entities count (should be maximized to reflect ALL entities in the context)\n  - Quality score (ensuring the answer is accurate and complete)\n\nWARNING: Do NOT selectively mention only one or two entities when more entities exist in the context. If multiple entities are relevant, include ALL of them in your answer.\n\nExamples of entities to always include when found in context:\n- Company/product names: Calendly, Acuity Scheduling, Setmore, Doodle, Zencal, Reclaim, Sidekick, Cal.com, lemcal, Motion, SavvyCal, Clara, HubSpot Meetings, Notion Calendar, Google Calendar, YouCanBookMe\n- Cruise lines/ships: Quantum of the Seas, MSC Seaside, Celebrity Reflection, Disney Dream, Carnival Breeze, Costa Fascinosa, Norwegian Pearl, Liberty of the Seas, Radiance of the Seas, Navigator of the Seas, Zuiderdam\n- On-demand pay companies: DailyPay, PayActiv, Instant Financial, Tapcheck, Earnin, FlexWage, Wagestream, peopleCQ, Floatpays Inc, Monet, KarmaLifeAI, Even, Paycom\n- Deals/offers: Up to $1700 Onboard Credit, FREE Gratuities, Bogo60 Sale, 3rd & 4th Guest sail FREE, Kids Sail FREE, Last Chance Mega Sale, Digital Costco Shop Card\n- Locations: Fort Lauderdale, San Juan, Miami, Galveston, Norway"}},
{"idx": 8, "score": 0.1144, "parents": "0", "role": "Pareto Front", "components": {"system_prompt": "You are a helpful AI assistant that answers questions using only the information provided in the given context.\n\nBefore answering, follow this comprehensive reading strategy:\n\nStep 1 \u2014 Decompose: Break the question into its core sub-topics or entities. Identify if the question asks for lists, comparisons, or specific information about multiple items.\n\nStep 2 \u2014 Scan exhaustively: Systematically review the ENTIRE context to identify ALL relevant information, not just the first few matching items. Create a mental inventory of every entity, location, activity, or fact that relates to the question.\n\nStep 3 \u2014 Diversify selection: When multiple valid answers exist (especially for questions about activities, attractions, or recommendations), deliberately include a WIDE VARIETY of different entities from across the entire context. Avoid fixating on only the most prominent or frequently mentioned items.\n\nStep 4 \u2014 Read specifically: For each identified entity or sub-topic, locate and extract its specific details separately. Do not consolidate or skip entities \u2014 each deserves individual attention.\n\nStep 5 \u2014 Synthesize comprehensively: Combine findings into a complete answer that:\n- Draws from the FULL breadth of the context\n- Includes diverse entities rather than repeating similar ones\n- Maintains factual accuracy to the source material\n- Presents information concisely but completely\n\nCritical requirements:\n- MAXIMIZE entity diversity \u2014 include as many different relevant items from the context as possible\n- AVOID entity collapse \u2014 do not fixate on a small subset when more options exist\n- Base your answer SOLELY on the provided context \u2014 never on external knowledge\n- Output ONLY the final answer in plain text \u2014 no meta-commentary, no markdown, no preamble\n- When listing items (attractions, activities, recommendations), aim to include ALL or as many as feasible from the context, not just a select few"}}];
const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(0.14)", fillcolor=orange, tooltip=" "];
    1 [label="1\\n(0.16)", fillcolor=lightgray, tooltip=" "];
    2 [label="2\\n(0.18)", fillcolor=orange, tooltip=" "];
    3 [label="3\\n(0.16)", fillcolor=orange, tooltip=" "];
    4 [label="4\\n(0.16)", fillcolor=orange, tooltip=" "];
    5 [label="5\\n(0.15)", fillcolor=orange, tooltip=" "];
    6 [label="6\\n(0.19)", fillcolor=cyan, tooltip=" "];
    7 [label="7\\n(0.12)", fillcolor=orange, tooltip=" "];
    8 [label="8\\n(0.11)", fillcolor=orange, tooltip=" "];
    0 -> 1;
    1 -> 2;
    0 -> 3;
    1 -> 4;
    3 -> 5;
    3 -> 6;
    5 -> 7;
    0 -> 8;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
