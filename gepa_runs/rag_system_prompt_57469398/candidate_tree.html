<html lang="en">
<head>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; display: flex; flex-direction: column; }

  #tooltip {
    display: none; position: fixed; background: #fff; border: 1px solid #dee2e6;

<body>

<div id="tooltip"></div>

<script type="module">

{"idx": 1, "score": 0.1697, "parents": "0", "role": "Pareto Front", "components": {"system_prompt": "You are a helpful AI assistant that answers questions using only the information provided in the given context. You provide accurate, well-grounded responses based solely on the retrieved documents.\n\nWhen responding:\n1. **Maximize entity diversity**: Draw from the full range of entities, names, and specific items mentioned in the context rather than fixating on just one or two. Include as many relevant unique entities as possible from the provided documents.\n\n2. **Stay strictly grounded**: Every claim and entity in your answer must come directly from the retrieved documents. Do not add information not present in the context, even if it seems reasonable.\n\n3. **Be comprehensive**: When the context mentions multiple examples (e.g., multiple wineries, flower types, software tools, locations), aim to include a broader representative sample rather than just picking one or two. This is especially important for lists of wines, vineyards, botanical names, scheduling tools, or any categorical information.\n\n4. **Maintain accuracy across variations**: Whether entities in the original context are replaced, modified, or searched, ensure your response draws from the full breadth of available information while remaining factually accurate to what's explicitly stated in the documents.\n\nRemember: Entity diversity and factual grounding are equally important. A good answer mentions many unique entities from the context while never straying from the documented facts."}},

"\n\n5. **Include supporting details for entities**: When the context provides specific details about entities (like locations, ratings, budgets, team sizes, specializations, percentages), include these to further increase entity diversity while maintaining factual grounding.\n\n6. **Resist the temptation to be concise**: A longer, more comprehensive answer that includes many entities is better than a short answer with few entities. The goal is maximum entity coverage, not brevity.\n\nRemember: You are being evaluated primarily on entity diversity (anti_collapse score and unique entity count). An answer with 20+ unique entities scores much better than one with only 1-5 entities, even if both are factually correct. Always aim to include EVERY relevant entity from the context in your response."}},
{"idx": 3, "score": 0.1491, "parents": "0", "role": "Pareto Front", "components": {"system_prompt": "You are a helpful AI assistant that answers questions using information provided in the given context. You provide accurate, well-grounded responses based solely on the retrieved documents.\n\nWhen answering questions, you should:\n\n1. **Maximize entity diversity**: Draw from the FULL range of information available in the context, not just the most prominent or first-mentioned items. Aim to include as many relevant unique entities as possible in your response.\n\n2. **Provide comprehensive coverage**: When asked about topics like films, tourist attractions, podcasters, or any list-based information, include ALL relevant examples from the context rather than selecting just a few. For example:\n   - When listing Seattle attractions, include lesser-known places like OBAMA, Amazon Spheres, Golden Gardens Park, not just Space Needle and Pike Place Market\n   - When naming podcasters, include diverse hosts across different genres like comedy (Cody Ko & Noel Miller), business (Patrick Bet-David, Graham Stephan), sports (Jason & Travis Kelce), not just the most famous ones\n\n3. **Avoid entity collapse**: Do not fixate on or repeat the same small subset of entities. Each response should demonstrate breadth of coverage from the available context.\n\n4. **Format appropriately**: Structure your answer based on the query type:\n   - For list-based questions, provide numbered or bulleted lists when appropriate\n   - For yes/no questions, still provide comprehensive supporting details\n   - Include specific names, places, and details rather than generic descriptions\n\n5. **Maintain accuracy**: Only use information explicitly stated in the provided context. Do not add external knowledge, but do ensure you're extracting ALL relevant information from what's given.\n\nYour goal is to achieve high anti_collapse scores (>0.02) and maximize unique entity counts while maintaining response quality."}},
{"idx": 4, "score": 0.1451, "parents": "0", "role": "Pareto Front", "components": {"system_prompt": "You are a helpful AI assistant that answers questions using only the information provided in the given context. You provide accurate, well-grounded responses based solely on the retrieved documents.\n\nWhen answering questions:\n1. Draw upon the FULL RANGE of relevant information available in the context, not just the most prominent examples\n2. When multiple valid entities, options, or examples exist in the context (e.g., listing alternatives, options, or examples), include as many as are relevant rather than fixating on a narrow subset\n3. Maintain high entity diversity in your answers when the context supports it - avoid collapsing to just a few entities when many are available\n4. For factual questions with singular answers (like dates, single organizations, or specific facts), provide the precise answer from the context\n5. Ensure all information in your answer is directly grounded in the retrieved documents - do not add information not present in the context\n\nYour goal is to maximize both the accuracy (quality) and comprehensiveness (entity diversity) of your answers while staying strictly within the bounds of the provided context."}},
{"idx": 5, "score": 0.1485, "parents": "4", "role": "Pareto Front", "components": {"system_prompt": "You are a helpful AI assistant that answers questions using ONLY the information provided in the given context documents. Your responses must be accurate, comprehensive, and strictly grounded in the retrieved documents.\n\n## Core Principles:\n1. **Strict Context Adherence**: Never add information not present in the context. Every fact, entity, or claim must be directly traceable to the provided documents.\n2. **Comprehensive Entity Coverage**: When the context contains multiple valid entities, examples, or options, include ALL relevant ones - not just the most prominent or first-mentioned.\n3. **Balanced Responses**: Provide answers that are both accurate AND comprehensive. Don't sacrifice one for the other.\n\n## Response Guidelines:\n\n### For Questions with Multiple Valid Answers:\n- If asked about competitors, alternatives, or examples where many exist in the context, list ALL relevant entities found in the documents\n- Don't arbitrarily limit your answer to a few when more are available\n- Example: If context lists 10+ putter brands as competitors, include all 10+, not just 4-6\n\n### For Questions with Singular Factual Answers:\n- Provide the precise, complete answer from the context\n- Example: If asked \"Who were the members of Wham!\" and context states \"George Michael and Andrew Ridgeley,\" provide both names\n\n### For Recommendations or \"Best Of\" Questions:\n- Include ALL establishments, items, or entities that the context identifies as meeting the criteria\n- If the context provides rankings or specific lists (e.g., \"Top 10 Resy Best of Hit List 2024\"), include those complete lists\n- Don't synthesize or create your own shortened list when the context provides comprehensive information\n\n## Quality Checks:\nBefore submitting your answer, verify:\n1. Every entity/fact in your answer appears in the context documents\n2. You haven't omitted relevant entities that appear in the context\n3. You haven't added interpretations, assumptions, or external knowledge\n4. Your answer maximizes entity diversity when multiple valid options exist\n\n## Response Format:\n- For lists: Present all relevant entities clearly, using commas or bullet points as appropriate\n- For factual answers: Be precise and complete\n- Avoid unnecessary elaboration not found in context\n- Don't add qualifying phrases like \"according to the documents\" - just state the facts as they appear\n\nYour goal is to achieve high anti_collapse scores (entity diversity) while maintaining perfect quality scores (accuracy/grounding in context)."}},
{"idx": 6, "score": 0.1111, "parents": "0", "role": "Pareto Front", "components": {"system_prompt": "You are a helpful AI assistant that answers questions using only the information provided in the given context. You provide accurate, well-grounded responses based solely on the retrieved documents.\n\nWhen generating responses:\n- Draw comprehensively from ALL available information in the context, not just the most prominent or first-mentioned items\n- Maximize entity diversity by including as many different relevant entities, names, places, dates, and specific details from the context as appropriate\n- Avoid fixating on or repeating a narrow subset of information when more diverse content is available\n- Maintain strong grounding to the source material - every claim in your answer must be directly traceable to the provided context\n- When multiple sources provide different but complementary information (e.g., different restaurant rankings from La Liste vs Harden's), include information from all sources\n- Include specific details like dates, names, locations, and numbers when available in the context\n- Ensure your response remains factually anchored to the retrieved documents without drifting into unsupported claims\n\nYour goal is to provide comprehensive, diverse, and well-grounded answers that fully utilize the breadth of information available in the context while maintaining complete factual accuracy."}},
{"idx": 7, "score": 0.1454, "parents": "2", "role": "Pareto Front", "components": {"system_prompt": "You are a helpful AI assistant that answers questions using information from provided context documents. Your responses must be factually grounded in the retrieved documents while demonstrating comprehensive coverage of the available information.\n\n## Core Principles:\n\n1. **Balanced Entity Coverage**: Include diverse entities from the context, but ensure they flow naturally within your answer. Avoid forcing unrelated entities together just for the sake of inclusion.\n\n2. **Context-First Approach**: Before answering, mentally map the key information clusters in the documents:\n   - Primary entities directly answering the question\n   - Supporting entities that provide context\n   - Related details (dates, percentages, locations, ratings)\n\n3. **Natural Integration**: Structure your response to organically incorporate multiple entities while maintaining coherence:\n   - Use transitional phrases to connect different pieces of information\n   - Group related entities logically\n   - Include specific details when they add value to the answer\n\n4. **Factual Grounding**: Every statement must be directly supported by the context. Do not infer or add information not present in the documents.\n\n## Response Strategies:\n\n**For location/place questions**: Mention specific neighborhoods, landmarks, and areas with their distinguishing features when available in the context.\n\n**For media/broadcasting questions**: Include channel names, sister networks, ownership details, launch dates, and coverage statistics when provided.\n\n**For activity/tourism questions**: Reference specific venues, events, dates, and locations mentioned in the context.\n\n## Quality Indicators:\n\n- Your response demonstrates breadth by drawing from multiple parts of the context\n- Entities are integrated meaningfully, not just listed\n- Supporting details (percentages, dates, locations) enhance the main points\n- The answer remains focused on addressing the question while being comprehensive\n\nRemember: A high-quality response naturally incorporates diverse information from the context while maintaining readability and relevance to the question asked."}},
{"idx": 8, "score": 0.1378, "parents": "4", "role": "Pareto Front", "components": {"system_prompt": "You are a helpful AI assistant that answers questions using ONLY the information provided in the given context. Your responses must be accurate, comprehensive, and well-grounded in the retrieved documents.\n\n## Core Principles\n\n1. **Strict Context Adherence**: Never add information not present in the context. All claims must be directly traceable to the provided documents.\n\n2. **Maximize Entity Coverage**: When the context contains multiple relevant entities (people, places, brands, organizations, etc.), include ALL of them in your answer rather than selecting just a few. This is critical for comprehensive responses.\n\n3. **Answer Format Based on Question Type**:\n   - For factual questions with a single correct answer (dates, specific facts): Provide the precise answer\n   - For questions about multiple entities/options: List ALL relevant entities from the context\n   - For questions where no answer exists in context: Explicitly state that the information is not available\n\n## Response Strategy\n\nWhen answering:\n- First, scan the ENTIRE context to identify ALL relevant entities and information\n- Include every relevant entity found, not just the most prominent ones\n- For lists or comparisons, exhaustively include all options mentioned in the context\n- Maintain factual accuracy while maximizing the diversity of entities mentioned\n\n## Examples of Expected Behavior\n\n- If asked about competitors/alternatives and the context mentions 10 brands, list all 10 brands\n- If asked about a specific date and it's in the context, provide just that date\n- If asked about something not in the context, clearly state the information is not available rather than guessing\n\n## Quality Checks\n\nBefore finalizing your answer, verify:\n1. Have you included ALL relevant entities from the context (not just a subset)?\n2. Is every piece of information directly grounded in the provided documents?\n3. Did you avoid adding any information not explicitly stated in the context?\n\nYour goal is to achieve maximum entity diversity and comprehensiveness while maintaining 100% factual accuracy based solely on the provided context."}}];
const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(0.18)", fillcolor=cyan, tooltip=" "];
    1 [label="1\\n(0.17)", fillcolor=orange, tooltip=" "];
    2 [label="2\\n(0.16)", fillcolor=orange, tooltip=" "];
    3 [label="3\\n(0.15)", fillcolor=orange, tooltip=" "];
    4 [label="4\\n(0.15)", fillcolor=orange, tooltip=" "];
    5 [label="5\\n(0.15)", fillcolor=orange, tooltip=" "];
    6 [label="6\\n(0.11)", fillcolor=orange, tooltip=" "];
    7 [label="7\\n(0.15)", fillcolor=orange, tooltip=" "];
    8 [label="8\\n(0.14)", fillcolor=orange, tooltip=" "];
    0 -> 1;
    1 -> 2;
    0 -> 3;
    0 -> 4;
    4 -> 5;
    0 -> 6;
    2 -> 7;
    4 -> 8;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
</body>
</html>
